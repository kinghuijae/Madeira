name: LibraryControls
options:
  deploymentTarget:
    iOS: '27.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  LibraryControls:
    type: application
    platform: iOS
    sources: [App.swift, ProductionControls.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madeira.LibraryControls
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  LibraryControlsTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ControlsTests.swift]
    dependencies:
      - target: LibraryControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madeira.LibraryControlsTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LibraryControls:
    build:
      targets:
        LibraryControls: all
    test:
      targets: [LibraryControlsTests]
